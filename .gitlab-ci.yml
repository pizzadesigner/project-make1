stages:
  - test
  - deploy

.setup: &setup
  image: node:20
  tags: [default] # match the runner's tag
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

check:
  <<: *setup
  stage: test
  script:
    - npm run check

pages:
  <<: *setup
  stage: deploy
  script:
    - npm run build
    - rm -rf public # dist/ already holds the geo assets Vite copied out of public/
    - mv dist public # GitLab Pages publishes a folder named 'public'
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
